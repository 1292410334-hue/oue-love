<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>崇新 & 艺萌 · 像素小屋</title>
  <meta name="theme-color" content="#1a1426">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="game-shell">
    <header class="game-header">
      <div class="game-title">
        <span class="pixel-heart">♥</span>
        <div><h1>我们的像素小屋</h1><p>LOVE HOUSE · 2025.07.08</p></div>
      </div>
      <div class="game-day">DAY <strong id="day-counter">0000</strong></div>
    </header>

    <div class="game-meta">
      <span class="meta-item"><span class="dot green"></span> 小屋运行中</span>
      <span class="meta-item" id="found-count">✦ 已发现 0 / 12 个彩蛋</span>
    </div>

    <div class="screen-frame">
      <div class="screen-topbar">
        <span class="screen-name">客厅 · LIVING ROOM</span>
        <span class="screen-hint">方向键 / WASD 移动 · 空格互动</span>
      </div>
      <div class="game-screen">
        <canvas id="game" width="384" height="216"></canvas>
        <div class="zone-toast" id="zone-toast"><span class="toast-key">SPACE</span><span id="toast-text"></span></div>
        <div class="crt-glow" aria-hidden="true"></div>
      </div>
    </div>

    <div class="controls">
      <div class="dpad" aria-label="方向键">
        <button class="dpad-btn up" data-key="ArrowUp" aria-label="上">▲</button>
        <button class="dpad-btn left" data-key="ArrowLeft" aria-label="左">◀</button>
        <button class="dpad-btn down" data-key="ArrowDown" aria-label="下">▼</button>
        <button class="dpad-btn right" data-key="ArrowRight" aria-label="右">▶</button>
      </div>
      <div class="action-area">
        <button class="action-btn" id="interact-btn"><span class="action-icon">✦</span><span>互动<br><small>SPACE</small></span></button>
        <p class="control-tip">走到发光的物品旁<br>按互动键发现彩蛋</p>
      </div>
    </div>

    <div class="legend">
      <span>✦ 彩蛋清单</span>
      <div class="legend-items" id="legend-items"></div>
    </div>

    <footer class="game-footer">
      <p>CX <span>♥</span> YM · 我们的故事，藏在这个小屋里</p>
    </footer>
  </div>

  <!-- 彩蛋弹窗 -->
  <div class="modal" id="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <span class="modal-badge" id="modal-badge">✦</span>
        <div><p class="modal-eyebrow" id="modal-eyebrow">SECRET FOUND</p><h2 id="modal-title">彩蛋</h2></div>
        <button class="modal-close" data-close aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-foot"><button class="pixel-btn" data-close>收好了 ✓</button></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="game.js"></script>
  <script src="script.js"></script>
</body>
</html>
